name: Curator release artifacts

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve diagnostics from native builds and startup smoke tests. Curator's
# runtime logger honours RUST_LOG and already defaults to debug for local use;
# setting it here makes CI failures self-contained in the Actions log.
env:
  RUST_LOG: debug
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native UI libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - name: Server browser tests
        run: |
          node --test tests/*.test.js
          node --check static/oobe.js

  windows:
    needs: validate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - package: curator
            binary: curator
            artifact: curator.exe
          - package: curator-desktop
            binary: Curator
            artifact: Curator.exe
          - package: curator-viewer
            binary: curator-viewer
            artifact: curator-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ${{ matrix.binary }} with verbose diagnostics
        run: cargo build -vv --release --locked -p ${{ matrix.package }} --bin ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: curator-windows-${{ matrix.binary }}
          path: target/release/${{ matrix.artifact }}

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Native UI libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native editions with verbose diagnostics
        run: cargo build -vv --release --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: curator-linux-native
          path: |
            target/release/curator
            target/release/Curator
            target/release/curator-viewer

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/**
