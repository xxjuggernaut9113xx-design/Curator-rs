[package]
name = "curator-desktop"
version.workspace = true
edition.workspace = true
description = "Curator Host native media library"
default-run = "Curator"

[[bin]]
name = "Curator"
path = "src/main.rs"

[build-dependencies]
slint-build = "=1.18.0"

[dependencies]
curator = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
slint = "=1.18.0"
rfd = "=0.16.0"
tempfile = "3"
