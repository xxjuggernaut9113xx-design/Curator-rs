[package]
name = "curator-viewer"
version.workspace = true
edition.workspace = true
description = "Curator Tailnet Viewer"

[[bin]]
name = "curator-viewer"
path = "src/main.rs"

[build-dependencies]
slint-build = "=1.18.0"

[dependencies]
curator = { path = ".." }
curator-desktop = { path = "../desktop" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
slint = "=1.18.0"
dirs = "5"
